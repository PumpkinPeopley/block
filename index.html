<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Block Blast</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #gameFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe
    id="gameFrame"
    src="https://script.google.com/macros/s/AKfycbx6MfL8GfUMmU29JopEWmCTIPvMw1ISilZPiIL08laJe2aWzT-JVXjHmjtbOaKKgpOP/exec"
    title="Block Blast"
    allow="autoplay; fullscreen; gamepad; pointer-lock"
    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-forms allow-same-origin allow-scripts allow-pointer-lock allow-popups">
  </iframe>
</body>
</html>
